name: m1-tsan

on:
  push:
    branches: [master, feat/m2-replaylog]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang
          clang++ --version
          uname -a
          grep -o 'cx16' /proc/cpuinfo | head -n1 || echo "cx16 not found"

      - name: Configure (TSan + mcx16)
        run: |
          cmake -B build-tsan \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1 -mcx16 -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan -j$(nproc)

      - name: Platform contract (128-bit lock-free)
        run: |
          cd build-tsan
          ./tests/unit_compact_snapshot 2>&1 | tee /tmp/platform.log
          if grep -q "= FALSE" /tmp/platform.log; then
            echo "::error::__atomic_always_lock_free(16) is FALSE on x86_64 CI"
            exit 1
          fi
          echo "OK: 128-bit atomic is lock-free on x86_64"

      - name: Positive test (with whitelist, race-free)
        run: |
          cd build-tsan
          export TSAN_OPTIONS="suppressions=$(cd .. && pwd)/tsan.supp halt_on_error=1 print_suppressions=1"
          ctest --output-on-failure -E "g2_million_tick|g1_compile_fail"

      - name: Negative control (fence removed, TSan MUST detect race)
        run: |
          cd build-tsan
          # 去掉 read() 里两个 acquire fence（保留 write() 的 release fence）
          sed -i 's/atomic_thread_fence.*memory_order_acquire.*;//' ../include/aion/m1/l3/seqlock.hpp
          echo "=== seqlock.hpp fence 剩余 ==="
          grep -n "fence" ../include/aion/m1/l3/seqlock.hpp || echo "(no fence left)"
          cmake --build . -j$(nproc)

          # 关键：不用白名单（suppressions=/dev/null），删 fence 后 TSan 必须报 race
          export TSAN_OPTIONS="suppressions=/dev/null halt_on_error=1"

          set +e
          ctest -R unit_seqlock --output-on-failure 2>&1 | tee /tmp/negative_control.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "ctest exit code = $RC"

          if [ $RC -eq 0 ]; then
            echo "::error::Negative control FAILED: ctest passed despite fence removal"
            echo "::error::TSan did not detect the real data race -> whitelist over-suppressing"
            exit 1
          fi

          if grep -q "ThreadSanitizer: data race" /tmp/negative_control.log; then
            echo "OK: Negative control PASSED: TSan detected data race after fence removal"
            echo "OK: Whitelist is NOT over-suppressing (A6 evidence complete)"
            grep -B2 -A8 "ThreadSanitizer: data race" /tmp/negative_control.log | head -n 30
          else
            echo "::error::Negative control FAILED: ctest failed but no 'data race' in log"
            head -n 30 /tmp/negative_control.log
            exit 1
          fi
